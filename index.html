<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>PLAbs Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
  <!-- THEME TOGGLE (keep this) -->
  <button class="theme-toggle" id="themeToggle" aria-label="Switch light/dark mode">🌓</button>
  
  <div class="quiz-wrapper">
    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
      <div class="start-content">
        <h1 class="title">PERLE<span class="accent">LABs</span>CHALLENGE</h1>
        <p class="subhead">game show edition</p>
        
        <div class="feature-grid">
          <div class="feature-item">
            <span class="feature-icon">⏱️</span>
            <span>15 sec timer</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">🎯</span>
            <span>instant feedback</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">📊</span>
            <span>progress bar</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">🏆</span>
            <span>leaderboard</span>
          </div>
        </div>

        <!-- LOGIN SECTION -->
        <div class="login-section">
          <input type="text" id="playerName" placeholder="YOUR NAME" maxlength="20" class="login-input">
          <input type="text" id="roomCode" placeholder="ROOM CODE (or leave blank)" class="login-input">
          <div class="room-info" id="roomDisplay">
            ✨ NEW ROOM: <span id="newRoomCode">----</span>
          </div>
        </div>

        <button class="btn btn-primary" id="joinBtn">▶ JOIN QUIZ</button>
        <button class="btn btn-secondary" id="newRoomBtn">🎲 CREATE NEW ROOM</button>
      </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen"></div>

    <!-- LEADERBOARD SCREEN -->
    <div id="leaderboard-screen" class="screen"></div>
  </div>

  <!-- REMOVED: background picker and modal -->

  <!-- ALL JAVASCRIPT FILES -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="questions.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <!-- REMOVED: background.js -->
  <script src="quiz.js"></script>
  <script src="leaderboard.js"></script>
  <script src="main.js"></script>
</body>
</html>
