

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>2026 QUIZ · MILLIONAIRE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
  <!-- THEME TOGGLE -->
  <button class="theme-toggle" id="themeToggle" aria-label="Switch light/dark mode">🌓</button>
  
  <div class="quiz-wrapper">
    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
      <div class="start-content">
        <h1 class="title">PERLE<span class="accent">LABs</span>CHALLENGE</h1>
        <p class="subhead">game show edition</p>
        
        <div class="feature-grid">
          <div class="feature-item">
            <span class="feature-icon">⏱️</span>
            <span>15 sec timer</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">🎯</span>
            <span>instant feedback</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">📊</span>
            <span>progress bar</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">🏆</span>
            <span>score card</span>
          </div>
        </div>

        <!-- SIMPLE NAME INPUT -->
        <div class="login-section">
          <input type="text" id="playerName" placeholder="YOUR NAME" maxlength="20" class="login-input">
        </div>

        <button class="btn btn-primary" id="startBtn">▶ START QUIZ</button>
      </div>
    </div>

    <!-- INSTRUCTIONS SCREEN -->
    <div id="instructions-screen" class="screen">
      <div class="instructions-content">
        <div class="instructions-header">
          <h2 class="glowing-text">🎮 GET READY</h2>
        </div>

        <div class="player-card">
          <span class="player-icon">👤</span>
          <span class="player-name" id="instructionPlayerName">Player</span>
        </div>

        <div class="countdown-container">
          <div class="countdown-circle" id="countdownCircle">
            <span id="countdownNumber">10</span>
          </div>
          <p class="countdown-label" id="countdownStatus">get ready...</p>
        </div>

        <div class="instruction-box">
          <h3>📋 RULES</h3>
          <ul class="rules-list">
            <li><span class="rule-icon">⏱️</span> 15 seconds per question</li>
            <li><span class="rule-icon">✅</span> Correct = Green highlight</li>
            <li><span class="rule-icon">❌</span> Wrong = Red highlight</li>
            <li><span class="rule-icon">🏆</span> See your score at the end</li>
          </ul>
        </div>

        <div class="waiting-players" id="waitingPlayers">
          <div class="players-list" id="playersList"></div>
        </div>

        <button class="btn btn-primary" id="startGameBtn">▶ START NOW</button>
        <p class="skip-hint" id="skipHint">Game starts in <span id="autoTimer">10</span>s</p>
      </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen"></div>
  </div>

  <!-- ALL JAVASCRIPT FILES -->
  <script src="questions.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="instructions.js"></script>
  <script src="quiz.js"></script>
  <script src="main.js"></script>
</body>
</html>
